name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Sitemap
        uses: treosh/sitemap-generator@v1
        with:
          sitemap-path: 'sitemap.xml'
          base-url: 'https://usa.simpletoollab.com'

      - name: Commit Sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic sitemap update"
          file_pattern: sitemap.xml
