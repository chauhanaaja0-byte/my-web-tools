name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          baseUrl: 'https://simpletoollab.com/'

      - name: Commit Sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic sitemap update"
          file_pattern: sitemap.xml
