    // ==================== IMAGE PROCESSING ENGINE ====================

    function applySeparableGaussian(data, width, height, radius) {
      if (radius < 0.5) return data;
      const sigma = radius / 2.5;
      const kSize = Math.min(25, Math.ceil(radius * 2.5));
      const kernel = new Float32Array(kSize * 2 + 1);
      let sum = 0;
      for (let i = -kSize; i <= kSize; i++) {
        const val = Math.exp(-(i * i) / (2 * sigma * sigma));
        kernel[i + kSize] = val;
        sum += val;
      }
      for (let i = 0; i < kernel.length; i++) kernel[i] /= sum;

      const src = data.data;
      const tmp = new Uint8ClampedArray(src.length);
      const out = new Uint8ClampedArray(src.length);

      // Horizontal 1D Pass
      for (let y = 0; y < height; y++) {
        const rowOffset = y * width * 4;
        for (let x = 0; x < width; x++) {
          let r = 0, g = 0, b = 0;
          for (let k = -kSize; k <= kSize; k++) {
            const px = Math.min(width - 1, Math.max(0, x + k));
            const idx = rowOffset + px * 4;
            const w = kernel[k + kSize];
            r += src[idx] * w;
            g += src[idx + 1] * w;
            b += src[idx + 2] * w;
          }
          const outIdx = rowOffset + x * 4;
          tmp[outIdx] = r;
          tmp[outIdx + 1] = g;
          tmp[outIdx + 2] = b;
          tmp[outIdx + 3] = src[outIdx + 3];
        }
      }

      // Vertical 1D Pass
      for (let x = 0; x < width; x++) {
        for (let y = 0; y < height; y++) {
          let r = 0, g = 0, b = 0;
          for (let k = -kSize; k <= kSize; k++) {
            const py = Math.min(height - 1, Math.max(0, y + k));
            const idx = (py * width + x) * 4;
            const w = kernel[k + kSize];
            r += tmp[idx] * w;
            g += tmp[idx + 1] * w;
            b += tmp[idx + 2] * w;
          }
          const outIdx = (y * width + x) * 4;
          out[outIdx] = r;
          out[outIdx + 1] = g;
          out[outIdx + 2] = b;
          out[outIdx + 3] = tmp[outIdx + 3];
        }
      }

      return new ImageData(out, width, height);
    }

    function applyMotionBlur(data, width, height, distance, angleDeg) {
      if (distance <= 0) return data;
      const src = data.data;
      const out = new Uint8ClampedArray(src.length);
      const rad = (angleDeg * Math.PI) / 180;
      const dx = Math.cos(rad);
      const dy = Math.sin(rad);
      const steps = Math.min(30, Math.floor(distance));

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let r = 0, g = 0, b = 0, count = 0;
          for (let s = -steps; s <= steps; s++) {
            const px = Math.round(x + s * dx);
            const py = Math.round(y + s * dy);
            if (px >= 0 && px < width && py >= 0 && py < height) {
              const idx = (py * width + px) * 4;
              r += src[idx];
              g += src[idx + 1];
              b += src[idx + 2];
              count++;
            }
          }
          const outIdx = (y * width + x) * 4;
          out[outIdx] = r / count;
          out[outIdx + 1] = g / count;
          out[outIdx + 2] = b / count;
          out[outIdx + 3] = src[outIdx + 3];
        }
      }
      return new ImageData(out, width, height);
    }

    function applyUnsharpMask(orig, blurred, amount, threshold) {
      if (amount <= 0) return orig;
      const src = orig.data;
      const blur = blurred.data;
      const out = new Uint8ClampedArray(src.length);
      const gain = amount / 30;

      for (let i = 0; i < src.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          const diff = src[i + c] - blur[i + c];
          if (Math.abs(diff) >= threshold) {
            const val = src[i + c] + diff * gain;
            out[i + c] = Math.min(255, Math.max(0, val));
          } else {
            out[i + c] = src[i + c];
          }
        }
        out[i + 3] = src[i + 3];
      }
      return new ImageData(out, orig.width, orig.height);
    }

    function applyHighPass(orig, blurred, blendAmount) {
      if (blendAmount <= 0) return orig;
      const src = orig.data;
      const blur = blurred.data;
      const out = new Uint8ClampedArray(src.length);
      const factor = blendAmount / 100;

      for (let i = 0; i < src.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          const base = src[i + c];
          const hp = Math.min(255, Math.max(0, base - blur[i + c] + 128));
          let blended = base < 128
            ? (2 * base * hp) / 255
            : 255 - (2 * (255 - base) * (255 - hp)) / 255;
          out[i + c] = Math.min(255, Math.max(0, base * (1 - factor) + blended * factor));
        }
        out[i + 3] = src[i + 3];
      }
      return new ImageData(out, orig.width, orig.height);
    }

    function processImagePipeline(rawImageData, adj) {
      const { width, height } = rawImageData;
      let current = new ImageData(new Uint8ClampedArray(rawImageData.data), width, height);

      // 1. Tone adjustments
      const src = current.data;
      const evFactor = Math.pow(2, adj.exposure);
      const bright = adj.brightness * 1.2;
      const contrastFactor = (259 * (adj.contrast + 255)) / (255 * (259 - adj.contrast));
      const satFactor = 1 + adj.saturation / 100;

      for (let i = 0; i < src.length; i += 4) {
        let r = src[i] * evFactor + bright;
        let g = src[i + 1] * evFactor + bright;
        let b = src[i + 2] * evFactor + bright;

        r = contrastFactor * (r - 128) + 128;
        g = contrastFactor * (g - 128) + 128;
        b = contrastFactor * (b - 128) + 128;

        if (satFactor !== 1) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          r = lum + (r - lum) * satFactor;
          g = lum + (g - lum) * satFactor;
          b = lum + (b - lum) * satFactor;
        }

        if (adj.bokehBoost > 0) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (lum > 180) {
            const boost = (adj.bokehBoost / 100) * (lum - 180);
            r += boost; g += boost; b += boost;
          }
        }

        src[i] = Math.min(255, Math.max(0, r));
        src[i + 1] = Math.min(255, Math.max(0, g));
        src[i + 2] = Math.min(255, Math.max(0, b));
      }

      // 2. Spatial Blur
      if (adj.blurRadius > 0) {
        current = applySeparableGaussian(current, width, height, adj.blurRadius);
      }
      if (adj.motionDistance > 0) {
        current = applyMotionBlur(current, width, height, adj.motionDistance, adj.motionAngle);
      }

      // 3. Unsharp Mask Sharpening
      if (adj.sharpnessAmount > 0) {
        const blurCopy = applySeparableGaussian(current, width, height, adj.usmRadius);
        current = applyUnsharpMask(current, blurCopy, adj.sharpnessAmount, adj.usmThreshold);
      }

      // 4. High Pass Filter & Clarity
      if (adj.highPassBlend > 0 || adj.clarityAmount > 0) {
        const hpBlur = applySeparableGaussian(current, width, height, 4.0);
        const totalBlend = Math.min(100, adj.highPassBlend + adj.clarityAmount * 0.7);
        current = applyHighPass(current, hpBlur, totalBlend);
      }

      return current;
    }

        const defaultSample = SAMPLE_IMAGES[0];
        const defaultUrl = createProceduralSampleUrl(defaultSample);
        loadImageFromUrl(defaultUrl, 'sample_portrait.png');
      }, [loadImageFromUrl]);

      // Re-run processing pipeline when adjustments change
      useEffect(() => {
        if (!rawOriginalData) return;
        if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current);

        setIsProcessing(true);
        processingTimeoutRef.current = setTimeout(() => {
          try {
            const processedData = processImagePipeline(rawOriginalData, adjustments);
            const outCanvas = document.createElement('canvas');
            outCanvas.width = processedData.width;
            outCanvas.height = processedData.height;
            const outCtx = outCanvas.getContext('2d');
            if (outCtx) {
              outCtx.putImageData(processedData, 0, 0);
              setProcessedCanvas(outCanvas);
            }
          } catch (err) {
            console.error('Processing error:', err);
          } finally {
            setIsProcessing(false);
          }
        }, 35);

        return () => {
          if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current);
        };
      }, [rawOriginalData, adjustments]);

      // History Helpers
      const pushHistory = (newAdj, label = 'Adjustment') => {
        const next = history.slice(0, historyIndex + 1);
        next.push({ adjustments: newAdj, label });
        if (next.length > 25) next.shift();
        setHistory(next);
        setHistoryIndex(next.length - 1);
      };

      const handleUpdateAdjustments = (partial) => {
        const updated = { ...adjustments, ...partial };
        setAdjustments(updated);
        setActivePresetId(undefined);
        pushHistory(updated, 'Adjustment');
      };

      const handleSelectPreset = (preset) => {
        setActivePresetId(preset.id);
        const updated = { ...DEFAULT_ADJUSTMENTS, ...preset.settings };
        setAdjustments(updated);
        if (preset.category === 'blur') setToolMode('blur');
        if (preset.category === 'sharpness') setToolMode('sharpness');
        pushHistory(updated, `Preset: ${preset.name}`);
      };

      const handleSelectSample = (sample) => {
        setSelectedSampleId(sample.id);
        const url = createProceduralSampleUrl(sample);
        loadImageFromUrl(url, `${sample.id}.png`);
      };

      const handleResetAll = () => {
        setAdjustments(DEFAULT_ADJUSTMENTS);
        setActivePresetId(undefined);
        pushHistory(DEFAULT_ADJUSTMENTS, 'Reset All');
      };

      const handleUndo = () => {
        if (historyIndex > 0) {
          const target = historyIndex - 1;
          setHistoryIndex(target);
          setAdjustments(history[target].adjustments);
        }
      };

      const handleRedo = () => {
        if (historyIndex < history.length - 1) {
          const target = historyIndex + 1;
          setHistoryIndex(target);
          setAdjustments(history[target].adjustments);
        }
      };

      // File upload handler
      const handleFileUpload = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const url = e.target?.result;
          if (url) {
            setSelectedSampleId(undefined);
            loadImageFromUrl(url, file.name);
          }
        };
        reader.readAsDataURL(file);
      };

      // Drag & Drop
      const handleDragOver = (e) => { e.preventDefault(); setIsDraggingFile(true); };
      const handleDragLeave = (e) => { e.preventDefault(); setIsDraggingFile(false); };
      const handleDrop = (e) => {
        e.preventDefault();
        setIsDraggingFile(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileUpload(e.dataTransfer.files[0]);
        }
      };

      // Split View Dragging
      const handleSplitMove = (e) => {
        if (!isDraggingSplit || !splitContainerRef.current) return;
        const rect = splitContainerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = clientX - rect.left;
        const pct = Math.min(100, Math.max(0, (x / rect.width) * 100));
        setSplitPosition(pct);
      };

      // Render Output Export
      const handleDownloadExport = () => {
        if (!processedCanvas) return;
        const exp = document.createElement('canvas');
        const tw = Math.round(processedCanvas.width * exportScale);
        const th = Math.round(processedCanvas.height * exportScale);
        exp.width = tw;
        exp.height = th;
        const ectx = exp.getContext('2d');
        ectx.imageSmoothingQuality = 'high';
        ectx.drawImage(processedCanvas, 0, 0, tw, th);

        const ext = exportFmt === 'image/jpeg' ? 'jpg' : exportFmt === 'image/webp' ? 'webp' : 'png';
        const a = document.createElement('a');
        a.download = `${exportName || 'pixelcraft_edited'}.${ext}`;
        a.href = exp.toDataURL(exportFmt, 0.95);
        a.click();
        setIsExportOpen(false);
      };

      return (
        <div
          className="min-h-screen bg-white text-slate-900 flex flex-col antialiased"
          onDragOver={handleDragOver}
          onDragLeave={handleDragLeave}
          onDrop={handleDrop}
        >
          {/* File Input */}
          <input
            ref={fileInputRef}
            type="file"
            accept="image/png,image/jpeg,image/webp,image/bmp"
            className="hidden"
            onChange={(e) => {
              if (e.target.files && e.target.files[0]) {
                handleFileUpload(e.target.files[0]);
              }
            }}
          />

          {/* Drag Overlay */}
          {isDraggingFile && (
            <div className="fixed inset-0 z-50 bg-blue-600/90 backdrop-blur-xs flex flex-col items-center justify-center text-white border-4 border-dashed border-white p-8">
              <svg className="w-16 h-16 animate-bounce mb-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
              </svg>
              <h2 className="text-2xl font-black">Drop Image File Anywhere</h2>
              <p className="text-sm opacity-90 mt-1">PNG, JPG, WebP supported for instant local processing</p>
            </div>
          )}

          {/* Header */}
          <header className="w-full bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                  <svg className="w-5 h-5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/></svg>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base font-extrabold text-slate-900 tracking-tight">PixelCraft Studio</h1>
                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">
                      Client-Side
                    </span>
                  </div>
                  <p className="text-[11px] font-medium text-slate-500">Image Blur, Sharpness &amp; Unsharp Masking</p>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <div className="hidden sm:flex items-center border border-slate-200 rounded-xl p-0.5 bg-slate-50">
                  <button
                    onClick={handleUndo}
                    disabled={historyIndex <= 0}
                    className="p-2 rounded-lg text-slate-400 disabled:opacity-30 hover:text-slate-900 hover:bg-white transition-all"
                  >
                    <svg className="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 7v6h6M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
                  </button>
                  <button
                    onClick={handleRedo}
                    disabled={historyIndex >= history.length - 1}
                    className="p-2 rounded-lg text-slate-400 disabled:opacity-30 hover:text-slate-900 hover:bg-white transition-all"
                  >
                    <svg className="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M21 7v6h-6M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/></svg>
                  </button>
                </div>

                <button
                  onClick={handleResetAll}
                  className="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition-all cursor-pointer"
                >
                  <svg className="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                  <span>Reset</span>
                </button>

                <button
                  onClick={() => setIsShareOpen(true)}
                  className="hidden md:flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-all cursor-pointer"
                >
                  <svg className="w-3.5 h-3.5 text-cyan-600 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                  <span>Share</span>
                </button>

                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-all cursor-pointer"
                >
                  <svg className="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                  <span className="hidden sm:inline">Upload Image</span>
                </button>

                <button

                >
                  <svg className="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                  <span>Export</span>
                </button>
              </div>
            </div>
          </header>

          <!-- Main Layout -->
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 flex flex-col gap-6">

                  <span className="text-xs font-bold uppercase tracking-wider text-slate-700">Studio One-Click Presets</span>
                </div>
                <span className="text-[11px] text-slate-400">Click to instantly apply professional recipes</span>
              </div>

                      onClick={() => handleSelectPreset(p)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap flex items-center gap-1.5 transition-all shadow-2xs cursor-pointer ${
                        isActive
                          ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                          : 'border border-slate-200 bg-slate-50 hover:bg-white text-slate-700'
                      }`}
                    >
                      <span>{p.name}</span>
                    </button>
                  );

              </div>
            </div>

            {/* 2. Top Header Banner Ad (468x60) */}
            <AdBanner468 />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              {/* Canvas Column (7 Cols) */}
              <div className="lg:col-span-7 flex flex-col gap-4">
                <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col gap-3">
                  
                  {/* Toolbar */}
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                      <button
                        onClick={() => setViewMode('split')}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                          viewMode === 'split' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Split Slider
                      </button>
                      <button
                        onClick={() => setViewMode('side')}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                          viewMode === 'side' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Side-by-Side
                      </button>
                      <button
                        onClick={() => setViewMode('single')}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                          viewMode === 'single' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Processed
                      </button>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onMouseDown={() => setIsHoldingOriginal(true)}
                        onMouseUp={() => setIsHoldingOriginal(false)}
                        onTouchStart={() => setIsHoldingOriginal(true)}
                        onTouchEnd={() => setIsHoldingOriginal(false)}
                        className="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 select-none cursor-pointer"
                      >
                        Hold Original
                      </button>

                      <div className="flex items-center border border-slate-200 rounded-lg bg-slate-50 p-0.5">
                        <button
                          onClick={() => setZoomLevel((z) => Math.max(0.5, z - 0.25))}
                          className="p-1 text-slate-500 hover:text-slate-900"
                        >
                          <svg className="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M8 11h6"/></svg>
                        </button>
                        <span className="text-[11px] font-mono font-bold px-1.5 text-slate-700">
                          {Math.round(zoomLevel * 100)}%
                        </span>
                        <button
                          onClick={() => setZoomLevel((z) => Math.min(3, z + 0.25))}
                          className="p-1 text-slate-500 hover:text-slate-900"
                        >
                          <svg className="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M11 8v6M8 11h6"/></svg>
                        </button>
                        <button
                          onClick={() => setZoomLevel(1.0)}
                          className="p-1 text-slate-500 hover:text-slate-900"
                          title="Reset Zoom"
                        >
                          <svg className="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Viewport Box */}
                  <div
                    ref={splitContainerRef}
                    onMouseMove={handleSplitMove}
                    onTouchMove={handleSplitMove}
                    onMouseUp={() => setIsDraggingSplit(false)}
                    onTouchEnd={() => setIsDraggingSplit(false)}
                    className="bg-slate-950 rounded-xl relative overflow-hidden flex items-center justify-center min-h-[440px] max-h-[540px] select-none"
                  >
                    {/* Split Mode */}
                    {viewMode === 'split' && (
                      <div className="relative w-full h-full flex items-center justify-center overflow-hidden">
                        {originalImage && (
                          <img
                            src={originalImage.src}
                            alt="Original Preview"
                            style={{ transform: `scale(${zoomLevel})` }}
                            className="max-h-[500px] max-w-full object-contain pointer-events-none transition-transform duration-75"
                          />
                        )}

                        {/* Processed Overlay with Clip Path */}
                        <div
                          className={`absolute inset-0 flex items-center justify-center overflow-hidden pointer-events-none transition-opacity duration-75 ${
                            isHoldingOriginal ? 'opacity-0' : 'opacity-100'
                          }`}
                          style={{ clipPath: `polygon(0 0, ${splitPosition}% 0, ${splitPosition}% 100%, 0 100%)` }}
                        >
                          {processedCanvas && (
                            <img
                              src={processedCanvas.toDataURL()}
                              alt="Processed Preview"
                              style={{ transform: `scale(${zoomLevel})` }}
                              className="max-h-[500px] max-w-full object-contain transition-transform duration-75"
                            />
                          )}
                        </div>

                        {/* Slider Handle */}
                        <div
                          onMouseDown={() => setIsDraggingSplit(true)}
                          onTouchStart={() => setIsDraggingSplit(true)}
                          className="absolute top-0 bottom-0 w-1 bg-white cursor-ew-resize z-20 flex items-center justify-center shadow-2xl"
                          style={{ left: `${splitPosition}%` }}
                        >
                          <div className="w-7 h-7 rounded-full bg-white border-2 border-blue-600 shadow-lg flex items-center justify-center text-blue-600">
                            <svg className="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="m9 18-6-6 6-6M15 6l6 6-6 6"/></svg>
                          </div>
                        </div>

                        <span className="absolute top-3 left-3 bg-black/60 backdrop-blur-xs text-white text-[10px] font-bold px-2 py-0.5 rounded-md pointer-events-none z-10">BEFORE</span>
                        <span className="absolute top-3 right-3 bg-blue-600/80 backdrop-blur-xs text-white text-[10px] font-bold px-2 py-0.5 rounded-md pointer-events-none z-10">AFTER</span>
                      </div>
                    )}

                    {/* Side by Side Mode */}
                    {viewMode === 'side' && (
                      <div className="w-full h-full grid grid-cols-2 gap-2 p-2">
                        <div className="relative bg-slate-900 rounded-lg overflow-hidden flex items-center justify-center">
                          {originalImage && <img src={originalImage.src} alt="Original" className="max-h-[460px] max-w-full object-contain" />}
                          <span className="absolute top-2 left-2 bg-black/60 text-white text-[10px] font-bold px-2 py-0.5 rounded">ORIGINAL</span>
                        </div>
                        <div className="relative bg-slate-900 rounded-lg overflow-hidden flex items-center justify-center">
                          {processedCanvas && <img src={processedCanvas.toDataURL()} alt="Processed" className="max-h-[460px] max-w-full object-contain" />}
                          <span className="absolute top-2 right-2 bg-blue-600/80 text-white text-[10px] font-bold px-2 py-0.5 rounded">PROCESSED</span>
                        </div>
                      </div>
                    )}

                    {/* Single Mode */}
                    {viewMode === 'single' && (
                      <div className="w-full h-full flex items-center justify-center p-2">

                      </div>
                    )}

                    {/* Processing Toast */}
                    {isProcessing && (
                      <div className="absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur-xs text-cyan-400 text-xs font-mono px-3 py-1.5 rounded-lg border border-cyan-500/30 flex items-center gap-2 z-20">
                        <div className="w-3.5 h-3.5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                        <span>Processing convolution...</span>
                      </div>
                    )}
                  </div>

                  {/* Canvas Stats Bar */}
                  <div className="flex items-center justify-between text-xs text-slate-500 px-1 pt-1">

                      <svg className="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>

                    </span>

                {/* Samples Bar */}
                <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">

                    <div className="flex flex-col gap-4 animate-in fade-in">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                        <h3 className="text-xs font-bold text-cyan-900 uppercase tracking-wider">Unsharp Mask &amp; High-Pass</h3>
                        <button
                          onClick={() => handleUpdateAdjustments({ sharpnessAmount: 0, highPassBlend: 0, clarityAmount: 0, edgeBoost: 0 })}
                          className="text-[11px] font-semibold text-rose-600 hover:underline cursor-pointer"
                        >
                          Reset
                        </button>
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-cyan-800 font-bold">Unsharp Mask Gain</span>
                          <span className="font-mono text-slate-600">{adjustments.sharpnessAmount}%</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="100"
                          value={adjustments.sharpnessAmount}
                          onChange={(e) => handleUpdateAdjustments({ sharpnessAmount: parseFloat(e.target.value) })}
                          className="w-full text-cyan-600 accent-cyan-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-cyan-800 font-bold">Mask Blur Radius (σ)</span>
                          <span className="font-mono text-slate-600">{adjustments.usmRadius} px</span>
                        </div>
                        <input
                          type="range"
                          min="0.5"
                          max="8"
                          step="0.1"
                          value={adjustments.usmRadius}
                          onChange={(e) => handleUpdateAdjustments({ usmRadius: parseFloat(e.target.value) })}
                          className="w-full text-cyan-600 accent-cyan-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-cyan-800 font-bold">Noise Threshold</span>
                          <span className="font-mono text-slate-600">{adjustments.usmThreshold} lv</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="25"
                          value={adjustments.usmThreshold}
                          onChange={(e) => handleUpdateAdjustments({ usmThreshold: parseFloat(e.target.value) })}
                          className="w-full text-cyan-600 accent-cyan-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-blue-800 font-bold">High-Pass Filter Strength</span>
                          <span className="font-mono text-slate-600">{adjustments.highPassBlend}%</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="100"
                          value={adjustments.highPassBlend}
                          onChange={(e) => handleUpdateAdjustments({ highPassBlend: parseFloat(e.target.value) })}
                          className="w-full text-blue-600 accent-blue-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-indigo-800 font-bold">Midtone Clarity Boost</span>
                          <span className="font-mono text-slate-600">{adjustments.clarityAmount}%</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="100"
                          value={adjustments.clarityAmount}
                          onChange={(e) => handleUpdateAdjustments({ clarityAmount: parseFloat(e.target.value) })}
                          className="w-full text-indigo-600 accent-indigo-600"
                        />
                      </div>
                    </div>
                  )}

                  {/* BLUR PANEL */}
                  {toolMode === 'blur' && (
                    <div className="flex flex-col gap-4 animate-in fade-in">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                        <h3 className="text-xs font-bold text-purple-900 uppercase tracking-wider">Spatial Convolution &amp; Bokeh</h3>
                        <button
                          onClick={() => handleUpdateAdjustments({ blurRadius: 0, motionDistance: 0, radialIntensity: 0, tiltShiftBlurMax: 0, bokehBoost: 0 })}
                          className="text-[11px] font-semibold text-rose-600 hover:underline cursor-pointer"
                        >
                          Reset
                        </button>
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-purple-800 font-bold">Gaussian Blur Radius</span>
                          <span className="font-mono text-slate-600">{adjustments.blurRadius} px</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="30"
                          value={adjustments.blurRadius}
                          onChange={(e) => handleUpdateAdjustments({ blurRadius: parseFloat(e.target.value) })}
                          className="w-full text-purple-600 accent-purple-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-purple-800 font-bold">Motion Streak Distance</span>
                          <span className="font-mono text-slate-600">{adjustments.motionDistance} px</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="40"
                          value={adjustments.motionDistance}
                          onChange={(e) => handleUpdateAdjustments({ motionDistance: parseFloat(e.target.value) })}
                          className="w-full text-purple-600 accent-purple-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-slate-700 font-bold">Motion Direction Angle</span>
                          <span className="font-mono text-slate-600">{adjustments.motionAngle}°</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="360"
                          value={adjustments.motionAngle}
                          onChange={(e) => handleUpdateAdjustments({ motionAngle: parseFloat(e.target.value) })}
                          className="w-full text-slate-700 accent-slate-700"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-pink-800 font-bold">Bokeh Highlight Boost</span>
                          <span className="font-mono text-slate-600">{adjustments.bokehBoost}%</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="100"
                          value={adjustments.bokehBoost}
                          onChange={(e) => handleUpdateAdjustments({ bokehBoost: parseFloat(e.target.value) })}
                          className="w-full text-pink-600 accent-pink-600"
                        />
                      </div>
                    </div>
                  )}

                  {/* TONE PANEL */}
                  {toolMode === 'tone' && (
                    <div className="flex flex-col gap-4 animate-in fade-in">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                        <h3 className="text-xs font-bold text-amber-900 uppercase tracking-wider">Color &amp; Exposure</h3>
                        <button
                          onClick={() => handleUpdateAdjustments({ exposure: 0, brightness: 0, contrast: 0, saturation: 0 })}
                          className="text-[11px] font-semibold text-rose-600 hover:underline cursor-pointer"
                        >
                          Reset
                        </button>
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-amber-800 font-bold">Exposure</span>
                          <span className="font-mono text-slate-600">{adjustments.exposure > 0 ? '+' : ''}{adjustments.exposure} EV</span>
                        </div>
                        <input
                          type="range"
                          min="-1"
                          max="1"
                          step="0.05"
                          value={adjustments.exposure}
                          onChange={(e) => handleUpdateAdjustments({ exposure: parseFloat(e.target.value) })}
                          className="w-full text-amber-600 accent-amber-600"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-slate-800 font-bold">Brightness</span>
                          <span className="font-mono text-slate-600">{adjustments.brightness}%</span>
                        </div>
                        <input
                          type="range"
                          min="-50"
                          max="50"
                          value={adjustments.brightness}
                          onChange={(e) => handleUpdateAdjustments({ brightness: parseFloat(e.target.value) })}
                          className="w-full text-slate-700 accent-slate-700"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-slate-800 font-bold">Contrast</span>
                          <span className="font-mono text-slate-600">{adjustments.contrast}%</span>
                        </div>
                        <input
                          type="range"
                          min="-50"
                          max="50"
                          value={adjustments.contrast}
                          onChange={(e) => handleUpdateAdjustments({ contrast: parseFloat(e.target.value) })}
                          className="w-full text-slate-700 accent-slate-700"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-orange-800 font-bold">Saturation</span>
                          <span className="font-mono text-slate-600">{adjustments.saturation}%</span>
                        </div>
                        <input
                          type="range"
                          min="-100"
                          max="100"
                          value={adjustments.saturation}
                          onChange={(e) => handleUpdateAdjustments({ saturation: parseFloat(e.target.value) })}
                          className="w-full text-orange-600 accent-orange-600"
                        />
                      </div>
                    </div>
                  )}
                </div>

                {/* Quick Export CTA */}
                <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex items-center justify-between gap-4">
                  <div>
                    <p className="text-xs font-bold text-slate-900">Ready to save your image?</p>
                    <p className="text-[11px] text-slate-500">Supports 300 DPI, lossless PNG &amp; scaling</p>
                  </div>
                  <button
                    onClick={() => setIsExportOpen(true)}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all shadow-md shadow-emerald-600/25 cursor-pointer shrink-0"
                  >
                    <span>Export Image</span>
                  </button>
                </div>

                {/* 3. Sidebar Medium Rectangle Ad (300x250) */}
                <AdBanner300 />
              </div>
            </div>

            {/* 4. Native Sponsored Ad Container */}
            <AdNativeContainer />

            {/* Deep Dive & FAQ Section */}
            <div className="w-full flex flex-col gap-8 mt-6">
              <div className="w-full bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-xs">
                <div className="flex items-center gap-3 mb-6">
                  <div className="p-2.5 rounded-xl bg-blue-100 text-blue-700">
                    <svg className="w-6 h-6 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
                  </div>
                  <div>
                    <h2 className="text-xl font-extrabold text-slate-900">Spatial Filtering &amp; Convolution Mathematics</h2>
                    <p className="text-sm text-slate-500">How browser-native mathematical kernels transform image frequencies in real-time</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="bg-slate-50 rounded-xl p-5 border border-slate-200 flex flex-col justify-between">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-purple-700 bg-purple-100 px-2.5 py-1 rounded-full">Separable Gaussian</span>
                      <h3 className="font-bold text-slate-900 text-base mt-3 mb-2">2D Isotropic Gaussian</h3>
                      <p className="text-xs text-slate-600 leading-relaxed mb-4">
                        Rather than performing costly 2D matrix convolutions, our engine splits the Gaussian function into an initial horizontal 1D pass followed by a vertical 1D pass.
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 font-mono text-[11px] text-purple-900">
                      G(x) = (1 / √(2πσ²)) · e^[ -x² / (2σ²) ]
                    </div>
                  </div>

                  <div className="bg-slate-50 rounded-xl p-5 border border-slate-200 flex flex-col justify-between">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-cyan-700 bg-cyan-100 px-2.5 py-1 rounded-full">Unsharp Masking</span>
                      <h3 className="font-bold text-slate-900 text-base mt-3 mb-2">Edge Difference Amplification</h3>
                      <p className="text-xs text-slate-600 leading-relaxed mb-4">
                        Originated in traditional darkrooms. We create an unsharp low-frequency copy of the image, subtract it from the original to extract pure spatial edge gradients, and add it back scaled.
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 font-mono text-[11px] text-cyan-900">
                      I_sharp = I_orig + α · (I_orig - I_blur)
                    </div>
                  </div>

                  <div className="bg-slate-50 rounded-xl p-5 border border-slate-200 flex flex-col justify-between">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-100 px-2.5 py-1 rounded-full">High-Pass Filter</span>
                      <h3 className="font-bold text-slate-900 text-base mt-3 mb-2">Micro-Contrast Boost</h3>
                      <p className="text-xs text-slate-600 leading-relaxed mb-4">
                        Extracts the highest frequency fine details while centering midtones at 50% neutral gray. Overlay blend boosts tactile texture without washing out luminance.
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 font-mono text-[11px] text-indigo-900">
                      HP(x, y) = clamp(I_orig - I_blur + 128)
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </main>

          {/* Export Modal */}
          {isExportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden flex flex-col">
                <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <h3 className="font-bold text-slate-900 text-base">Export Rendered Image</h3>
                  <button onClick={() => setIsExportOpen(false)} className="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200">
                    <svg className="w-5 h-5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                  </button>
                </div>

                <div className="p-6 flex flex-col gap-4">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-600">File Name</label>
                    <input
                      type="text"
                      value={exportName}
                      onChange={(e) => setExportName(e.target.value)}
                      className="border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-blue-600"
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-600">Image Format</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['image/png', 'image/jpeg', 'image/webp'].map((fmt) => (
                        <button
                          key={fmt}
                          onClick={() => setExportFmt(fmt)}
                          className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                            exportFmt === fmt ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-200 bg-slate-50 text-slate-700'
                          }`}
                        >
                          {fmt === 'image/png' ? 'PNG (Lossless)' : fmt === 'image/jpeg' ? 'JPEG' : 'WebP'}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-600">Output Resolution Multiplier</label>
                    <div className="grid grid-cols-4 gap-2">
                      {[1, 1.5, 2, 4].map((scale) => (
                        <button
                          key={scale}
                          onClick={() => setExportScale(scale)}
                          className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                            exportScale === scale ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-200 bg-slate-50 text-slate-700'
                          }`}
                        >
                          {scale}x
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-600">Print DPI</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[72, 300, 600].map((dpi) => (
                        <button
                          key={dpi}
                          onClick={() => setExportDpi(dpi)}
                          className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                            exportDpi === dpi ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-200 bg-slate-50 text-slate-700'
                          }`}
                        >
                          {dpi} DPI
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between">
                  <span className="text-xs font-mono text-slate-500">
                    {Math.round(imageDimensions.width * exportScale)} × {Math.round(imageDimensions.height * exportScale)} px
                  </span>
                  <button
                    onClick={handleDownloadExport}
                    className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md shadow-emerald-600/25 transition-all cursor-pointer"
                  >
                    Download Image
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Share Modal */}
          {isShareOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-md w-full overflow-hidden flex flex-col">
                <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <h3 className="font-bold text-slate-900 text-base">Share Studio Tool</h3>
                  <button onClick={() => setIsShareOpen(false)} className="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200">
                    <svg className="w-5 h-5 fill-none stroke-current" viewBox="0 0 24 24" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                  </button>
                </div>
                <div className="p-6 flex flex-col gap-4">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-600">Studio URL</label>
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        readOnly
                        value={window.location.href}
                        className="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-mono text-slate-700 select-all focus:outline-none"
                      />
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(window.location.href);
                          setShareCopied(true);
                          setTimeout(() => setShareCopied(false), 2000);
                        }}
                        className="px-3 py-2 rounded-lg text-xs font-bold bg-cyan-600 text-white hover:bg-cyan-700 cursor-pointer"
                      >
                        {shareCopied ? 'Copied' : 'Copy'}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="w-full bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="font-bold text-slate-900">PixelCraft Studio</span>
                <span className="text-slate-300">•</span>
                <span>Zero-Data-Retention Client Sandbox</span>
              </div>
              <div className="flex items-center gap-4 text-slate-600">
                <span>Fast Separable Convolution</span>
                <span>•</span>
                <span>Unsharp Masking (USM)</span>
                <span>•</span>
                <span>Tilt-Shift Scheimpflug</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
