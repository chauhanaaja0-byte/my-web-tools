      let score = 30;
      const passed = [];
      const suggestions = [];

      if (data.personalInfo.fullName && data.personalInfo.email && data.personalInfo.phone) {
        score += 20;
        passed.push('Complete Contact Information Provided');
      } else {
        suggestions.push('Add Full Name, Email, and Phone Number.');
      }

      if (data.professionalSummary && data.professionalSummary.length > 60) {
        score += 15;
        passed.push('Professional Summary Included');
      } else {
        suggestions.push('Add a 3-4 sentence professional summary.');
      }

      if (data.workExperience.length >= 1) {
        score += 15;
        passed.push(`${data.workExperience.length} Experience roles added`);
      } else {
        suggestions.push('Add at least 1 work experience role.');
      }

      if (data.skills.length >= 5) {
        score += 10;
        passed.push(`${data.skills.length} Skills & competencies documented`);
      } else {
        suggestions.push('Include at least 5-8 relevant skills.');
      }

      if (data.education.length >= 1) {
        score += 10;
        passed.push('Education background listed');
      }

      return {
        score: Math.min(100, score),
        passed,
        suggestions

    // --- MAIN APP COMPONENT ---
    function App() {
      const STORAGE_KEY = 'resume_cv_maker_data_v1';
      
      const [resumeData, setResumeData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.personalInfo) return parsed;
          }
        } catch(e){}
        return defaultResumeData;
      });

      const [activeSectionTab, setActiveSectionTab] = useState('personal');
      const [mobileView, setMobileView] = useState('editor'); // 'editor' or 'preview'
      const [zoom, setZoom] = useState(100);
      const [showAtsModal, setShowAtsModal] = useState(false);

      // Auto-save
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(resumeData));
        } catch(e){}
      }, [resumeData]);

      // Responsive Mobile Auto-Scale Preview Zoom
      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth < 768) {
            const calculatedScale = Math.min(100, Math.floor((window.innerWidth - 32) / 8.16));
            setZoom(calculatedScale);
          } else {
            setZoom(100);
          }
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const handleUpdateResume = (patch) => {
        setResumeData(prev => ({ ...prev, ...patch }));
      };

      const handleUpdateSettings = (patch) => {
        setResumeData(prev => ({
          ...prev,
          settings: { ...prev.settings, ...patch }
        }));
      };

      const handlePrint = () => {
        window.print();
      };

      const handleExportJson = () => {
        const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resumeData, null, 2));
        const a = document.createElement('a');
        a.setAttribute('href', str);
        a.setAttribute('download', `${(resumeData.personalInfo.fullName || 'Resume').replace(/\s+/g, '_')}_Backup.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const handleImportJson = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const loaded = JSON.parse(evt.target.result);
              if (loaded && loaded.personalInfo) {
                setResumeData(loaded);
                alert("Resume data restored successfully!");
              }
            } catch(err) {
              alert("Invalid JSON backup file format.");
            }
          };
          reader.readAsText(file);
        }
      };

      const atsAudit = useMemo(() => evaluateAtsScore(resumeData), [resumeData]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 text-gray-900">
          
          {/* TOP NAVBAR */}

                </div>
              </div>

              {/* ACTION BUTTONS */}

                <button

                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>

              {activeSectionTab === 'skills' && (
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-gray-900 border-b pb-2">Skills & Competencies</h3>
                  <div className="flex flex-wrap gap-1.5">
                    {resumeData.skills.map((skill, idx) => (
                      <span key={idx} className="inline-flex items-center gap-1 px-2.5 py-1 bg-slate-100 border border-gray-300 rounded-lg text-xs font-semibold text-gray-800">
                        {skill}
                        <button
                          onClick={() => {
                            handleUpdateResume({
                              skills: resumeData.skills.filter((_, i) => i !== idx)
                            });
                          }}
                          className="text-gray-400 hover:text-red-500 font-bold ml-1"
                        >
                          ✕
                        </button>
                      </span>
                    ))}
                  </div>
                  <input
                    type="text"
                    placeholder="Type skill & press Enter to add..."
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && e.target.value.trim()) {
                        e.preventDefault();
                        handleUpdateResume({
                          skills: [...resumeData.skills, e.target.value.trim()]
                        });
                        e.target.value = '';
                      }
                    }}
                    className="w-full p-2.5 text-xs border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                  />
                </div>
              )}

              {/* 6. DESIGN & CUSTOMIZATION FORM */}
              {activeSectionTab === 'design' && (
                <div className="space-y-5">
                  <h3 className="text-sm font-bold text-gray-900 border-b pb-2">Template & Formatting</h3>
                  
                  {/* Template Picker */}
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-gray-700 uppercase tracking-wide">Template Layout</label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { id: 'ats-classic', name: 'ATS Classic', desc: '100% Parser Compliant' },
                        { id: 'modern', name: 'Modern Pro', desc: 'Clean Header & Borders' },
                        { id: 'executive', name: 'Executive', desc: 'Serif Leadership' },
                        { id: 'corporate', name: 'Corporate', desc: 'Solid Brand Banner' }
                      ].map(t => (
                        <button
                          key={t.id}
                          onClick={() => handleUpdateSettings({ template: t.id })}
                          className={`p-3 rounded-xl border text-left transition ${resumeData.settings.template === t.id ? 'border-blue-600 bg-blue-50/60 ring-2 ring-blue-600/20' : 'border-gray-200 hover:border-gray-300'}`}
                        >
                          <div className="text-xs font-bold text-gray-900">{t.name}</div>
                          <div className="text-[11px] text-gray-500">{t.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Accent Color Picker */}
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-gray-700 uppercase tracking-wide">Accent Color</label>
                    <div className="flex items-center gap-2">
                      {['#2563EB', '#0D9488', '#7C3AED', '#EA580C', '#E11D48', '#111827'].map(c => (
                        <button
                          key={c}
                          onClick={() => handleUpdateSettings({ accentColor: c })}
                          className={`w-7 h-7 rounded-full border transition ${resumeData.settings.accentColor === c ? 'ring-2 ring-offset-2 ring-blue-600' : 'border-transparent'}`}
                          style={{ backgroundColor: c }}
                        />
                      ))}
                      <input
                        type="color"
                        value={resumeData.settings.accentColor}
                        onChange={(e) => handleUpdateSettings({ accentColor: e.target.value })}
                        className="w-7 h-7 rounded-full cursor-pointer border-0 p-0"
                      />
                    </div>
                  </div>

                  {/* Font Family */}
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-gray-700 uppercase tracking-wide">Typography</label>
                    <select
                      value={resumeData.settings.fontFamily}
                      onChange={(e) => handleUpdateSettings({ fontFamily: e.target.value })}
                      className="w-full p-2.5 border rounded-lg text-xs outline-none bg-white font-medium"
                    >
                      <option value="Inter">Inter / Plus Jakarta Sans (Modern Clean)</option>
                      <option value="Roboto">Roboto (Standard Professional)</option>
                      <option value="Merriweather">Merriweather (Classic Serif)</option>
                      <option value="Playfair Display">Playfair Display (Executive Editorial)</option>
                    </select>
                  </div>

                  {/* Sizing & Spacing */}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-gray-700 uppercase tracking-wide block mb-1">Font Size</label>
                      <select
                        value={resumeData.settings.fontSize}
                        onChange={(e) => handleUpdateSettings({ fontSize: e.target.value })}
                        className="w-full p-2 border rounded-lg text-xs outline-none bg-white"
                      >
                        <option value="compact">Compact (Dense)</option>
                        <option value="medium">Standard (Optimal)</option>
                        <option value="large">Spacious</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-700 uppercase tracking-wide block mb-1">Spacing</label>
                      <select
                        value={resumeData.settings.spacing}
                        onChange={(e) => handleUpdateSettings({ spacing: e.target.value })}
                        className="w-full p-2 border rounded-lg text-xs outline-none bg-white"
                      >
                        <option value="compact">Tight</option>
                        <option value="standard">Standard</option>
                        <option value="comfortable">Relaxed</option>
                      </select>
                    </div>
                  </div>

                  {/* Paper Format */}
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-gray-700 uppercase tracking-wide">Paper Size</label>
                    <div className="flex gap-2">
                      <button
                        onClick={() => handleUpdateSettings({ paperSize: 'letter' })}
                        className={`flex-1 py-2 rounded-lg border text-xs font-bold ${resumeData.settings.paperSize === 'letter' ? 'bg-slate-900 text-white border-slate-900' : 'bg-gray-50 border-gray-200'}`}
                      >
                        US Letter (8.5 × 11 in)
                      </button>
                      <button
                        onClick={() => handleUpdateSettings({ paperSize: 'a4' })}
                        className={`flex-1 py-2 rounded-lg border text-xs font-bold ${resumeData.settings.paperSize === 'a4' ? 'bg-slate-900 text-white border-slate-900' : 'bg-gray-50 border-gray-200'}`}
                      >
                        A4 (210 × 297 mm)
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* SIDEBAR 300x250 SQUARE AD */}
              <SidebarSquareAd />

              {/* NATIVE CONTAINER AD */}
              <NativeContainerAd />

              {/* RESET TO SAMPLE */}
              <div className="pt-4 border-t border-gray-200 flex justify-between items-center text-xs">
                <button
                  onClick={() => {
                    if (confirm("Reset back to default sample resume?")) {
                      setResumeData(defaultResumeData);
                    }
                  }}
                  className="text-gray-500 hover:text-red-600 underline font-medium"
                >
                  Reset Sample Data
                </button>
              </div>
            </section>

            {/* RIGHT COLUMN: LIVE RESUME PREVIEW */}
            <section className={`lg:col-span-7 flex flex-col items-center bg-slate-200/70 overflow-y-auto max-h-[calc(100vh-140px)] p-4 sm:p-6 ${mobileView === 'preview' ? 'block' : 'hidden lg:block'}`}>
              
              {/* Preview Zoom Controls */}
              <div className="w-full max-w-[8.5in] flex justify-between items-center mb-3 no-print">
                <span className="text-xs font-bold text-gray-600 uppercase tracking-wider">
                  Live Preview ({resumeData.settings.paperSize === 'a4' ? 'A4 Format' : 'US Letter Format'})
                </span>
                <div className="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-lg border border-gray-300 shadow-2xs">
                  <button onClick={() => setZoom(Math.max(40, zoom - 10))} className="text-gray-600 hover:text-black font-bold px-1 text-xs">-</button>
                  <span className="text-xs font-semibold text-gray-700 w-12 text-center">{zoom}%</span>
                  <button onClick={() => setZoom(Math.min(140, zoom + 10))} className="text-gray-600 hover:text-black font-bold px-1 text-xs">+</button>
                </div>
              </div>

              {/* THE RESUME SHEET */}
              <div
                className={`resume-sheet ${resumeData.settings.paperSize === 'a4' ? 'format-a4' : ''}`}
                style={{
                  transform: `scale(${zoom / 100})`,
                  transformOrigin: 'top center'
                }}
              >
                <TemplateRenderer data={resumeData} settings={resumeData.settings} />
              </div>
            </section>

          </main>

          {/* ATS SCORE MODAL */}
          {showAtsModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-base font-bold text-gray-900">ATS Readiness Audit</h3>
                  <button onClick={() => setShowAtsModal(false)} className="text-gray-400 hover:text-gray-700 font-bold">✕</button>
                </div>

                <div className="text-center py-4 bg-emerald-50 rounded-xl border border-emerald-100">
                  <div className="text-4xl font-extrabold text-emerald-600">{atsAudit.score}%</div>
                  <p className="text-xs font-semibold text-emerald-800 mt-1">Recruiter ATS Parseability Score</p>
                </div>

                <div className="space-y-2 text-xs text-gray-700 max-h-60 overflow-y-auto">
                  <p className="font-bold text-gray-900">Passed Quality Checks:</p>
                  {atsAudit.passed.map((chk, i) => (
                    <div key={i} className="flex items-center gap-2 text-emerald-700">
                      <span>✓</span> {chk}
                    </div>
                  ))}

                  {atsAudit.suggestions.length > 0 && (
                    <>
                      <p className="font-bold text-amber-900 pt-2">Recommended Improvements:</p>
                      {atsAudit.suggestions.map((sug, i) => (
                        <div key={i} className="flex items-center gap-2 text-amber-800">
                          <span>•</span> {sug}
                        </div>
                      ))}
                    </>
                  )}
                </div>

                <button
                  onClick={() => setShowAtsModal(false)}
                  className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-xs transition"
                >
                  Close & Continue
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Standalone React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
